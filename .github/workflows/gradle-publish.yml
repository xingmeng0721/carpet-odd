name: Build

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build 1.21.10
        run: ./gradlew :1.21.10:build --no-daemon

      - name: Build 26.1
        run: ./gradlew :26.1:build --no-daemon

      - name: Upload 1.21.10
        uses: actions/upload-artifact@v4
        with:
          name: carpet-odd-1.21.10
          path: 1.21.10/build/libs/*.jar

      - name: Upload 26.1
        uses: actions/upload-artifact@v4
        with:
          name: carpet-odd-26.1
          path: 26.1/build/libs/*.jar
